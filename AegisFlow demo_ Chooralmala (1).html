<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--tx:#e8ecf1;--mu:#9aa5b4;--bd:#2e3844;--ac:#6fa8dc}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222b;--tx:#e8ecf1;--mu:#9aa5b4;--bd:#2e3844;--ac:#6fa8dc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:1000px;margin:auto;padding:12px}.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
h1{font-size:19px;margin:0}h2{font-size:15px;margin:0 0 8px}.mu{color:var(--mu);font-size:13px}.g{display:grid;gap:12px;grid-template-columns:1fr 1fr}@media(max-width:760px){.g{grid-template-columns:1fr}}
button,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.on{background:var(--ac);color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{padding:2px 9px;border-radius:99px;color:#fff;font-size:12px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:4px 6px;border-bottom:1px solid var(--bd)}.sc{overflow-x:auto}
input[type=range]{width:100%}textarea{width:100%;min-height:56px}.big{width:100%;padding:14px;font-size:17px;margin-bottom:8px}.ban{background:var(--t3);color:#fff;padding:10px;border-radius:8px;margin-bottom:10px}
svg{width:100%;height:auto;background:var(--bg);border-radius:8px}svg text{fill:var(--tx);font-size:11px}
input:not([type=range]):not([type=checkbox]):not([type=file]){font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px}a{color:var(--ac)}
:root{--bg:#f4f6f5;--card:#fff;--tx:#17211f;--mu:#66807a;--bd:#e3e9e7;--ac:#0f766e;--t0:#2f9e6e;--t1:#d9a62b;--t2:#e8833a;--t3:#d64545}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1716;--card:#172321;--tx:#e6f0ee;--mu:#8fa8a3;--bd:#26373a;--ac:#2dd4bf}:root:not([data-theme="light"]) button.on,:root:not([data-theme="light"]) button.p{color:#04201c}}
:root[data-theme="dark"]{--bg:#0f1716;--card:#172321;--tx:#e6f0ee;--mu:#8fa8a3;--bd:#26373a;--ac:#2dd4bf}
.w{max-width:960px;padding:16px}.c{border:0;box-shadow:0 1px 3px rgba(0,0,0,.08);border-radius:14px;padding:16px}h1{font-size:18px}h2{font-size:15px;margin-bottom:10px}
button{border-color:var(--bd);border-radius:10px}button.p{background:var(--ac);border-color:var(--ac)}
#roles{gap:0!important;background:var(--bd);border-radius:99px;padding:3px}#roles button{border:0;background:none;border-radius:99px;padding:6px 14px}#roles button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.2);font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--bd);margin-bottom:14px}.tabs button{border:0;border-radius:0;background:none;color:var(--mu);padding:8px 14px;white-space:nowrap;border-bottom:3px solid transparent}.tabs button.on{color:var(--ac);background:none;border-bottom-color:var(--ac);font-weight:600}
summary{cursor:pointer;color:var(--ac);padding:6px 0;font-weight:600}input{accent-color:var(--ac)}:root[data-theme="dark"] button.on,:root[data-theme="dark"] button.p{color:#04201c}:root[data-theme="dark"] .tabs button.on{color:var(--ac)}details table{margin-top:4px}
:root{--ac:#0f766e}
#sb{display:none;position:fixed;left:0;top:0;bottom:0;width:208px;background:#0b3d36;color:#e6f0ee;flex-direction:column;padding:14px 10px;gap:2px;overflow:auto;z-index:5}
body.r-admin #sb{display:flex}#sb .lg{font-weight:700;font-size:17px;margin-bottom:14px}#sb .lg div{font-weight:400;font-size:10px;opacity:.7}
#sb button{background:none;border:0;color:inherit;text-align:left;padding:9px 10px;border-radius:8px}#sb button.on{background:#1a6b5c;color:#fff}#sb .ft{margin-top:auto;font-size:12px;opacity:.8;padding:8px}
body.r-admin .w{margin-left:208px;max-width:none}body.r-admin .tabs{display:none}
@media(max-width:860px){body.r-admin .w{margin-left:0}body.r-admin #sb{position:static;width:auto;flex-direction:row;overflow-x:auto;padding:8px}#sb .lg,#sb .ft{display:none}#sb button{white-space:nowrap}}
.kpi{display:grid;gap:12px;grid-template-columns:repeat(4,1fr);margin-bottom:12px}.kpi .c{margin:0}@media(max-width:760px){.kpi{grid-template-columns:1fr 1fr}}.kpi b{font-size:26px;display:block}
.tb{color:#fff;padding:12px;border-radius:10px;font-size:20px;font-weight:700;margin-bottom:8px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:1px solid var(--bd);border-radius:8px;padding:3px 8px;font-size:12px}
.phone{max-width:390px;margin:8px auto;border:9px solid #111;border-radius:38px;background:var(--bg);overflow:hidden}.sbar{display:flex;justify-content:space-between;padding:8px 22px 0;font-size:12px;font-weight:600}
.ptitle{text-align:center;font-weight:700;padding:6px}.pbody{padding:10px}.phone .c{max-width:100%!important;box-shadow:none}
.big{border-radius:12px;font-weight:600}.pbody .big:nth-of-type(1){background:var(--t0);color:#fff;border-color:var(--t0)}.pbody .big:nth-of-type(2){border-color:var(--t0);color:var(--t0)}.pbody .big:nth-of-type(3){color:var(--t3)}
</style></head><body><div class="w">
<div class="row" style="justify-content:space-between;margin-bottom:10px"><div><h1>AegisFlow demo: Chooralmala, Wayanad</h1><div class="mu">Synthetic data, in-memory only (refresh resets). Camps and routes are illustrative.</div></div>
<div class="row" id="roles"></div></div><div id="app"></div></div>
<script>
const TN=['None','Watch','Warning','Evacuate'],TC=['--t0','--t1','--t2','--t3'];
const ML={tier:['സാധാരണ','ജാഗ്രത','മുന്നറിയിപ്പ്','ഒഴിഞ്ഞുപോകുക'],rec:'എനിക്ക് ലഭിച്ചു',safe:'ഞങ്ങൾ സുരക്ഷിതരാണ്',help:'ഞങ്ങൾക്ക് സഹായം വേണം',blk:'വഴി തടസ്സപ്പെട്ടു, മറ്റൊരു വഴി ഉപയോഗിക്കുക',camp:'ക്യാമ്പ്',rt:'വഴി',alt:'ബദൽ വഴി',noal:'ഇപ്പോൾ അലർട്ട് ഇല്ല'};
const EN={tier:TN,rec:'I received this',safe:'We are safe / evacuating',help:'We need help',blk:'Route blocked, use the alternate',camp:'Camp',rt:'Route',alt:'Alternate',noal:'No alert issued right now'};
const CAMPS=[{n:'Meppadi school camp',la:11.551,lo:76.133,cap:400,fac:'Water, toilets, medical desk'},{n:'Chooralmala school camp',la:11.4925,lo:76.179,cap:250,fac:'Water, kitchen'},{n:'Kalpetta community hall',la:11.53,lo:76.145,cap:300,fac:'Toilets, kitchen, generator'}];
const ROUTES=[{n:'Primary: to Chooralmala school camp',pts:[[11.4895,76.183],[11.4925,76.179]],st:'clear'},{n:'Alternate: via Meppadi road',pts:[[11.4895,76.183],[11.51,76.17],[11.551,76.133]],st:'clear'}];
const H=[{id:'h1',name:'Raman K.',v:1,lang:'ml',la:11.4905,lo:76.185,camp:1},{id:'h2',name:'Sreedevi P.',v:0,lang:'ml',la:11.4885,lo:76.181,camp:1},{id:'h3',name:'Joseph M.',v:1,lang:'en',la:11.4915,lo:76.188,camp:1},{id:'h4',name:'Fathima A.',v:0,lang:'ml',la:11.4875,lo:76.186,camp:0},{id:'h5',name:'Kunhi S.',v:0,lang:'en',la:11.4935,lo:76.183,camp:1},{id:'h6',name:'Lakshmi V.',v:1,lang:'ml',la:11.4895,lo:76.19,camp:0}];
const S={role:'admin',tab:'risk',hid:'h1',lang:'en',sim:{fc:60,past:40,ws:18,wd:235,gauge:true},alert:null,dl:{},conf:{},tasks:[],rej:-1,msg:null,log:[]};
const $=id=>document.getElementById(id),log=t=>S.log.unshift(new Date().toLocaleTimeString()+'  '+t);
function tier(a,b){return a>=204.5||b>=400?3:a>=115.6||b>=250?2:a>=64.5||b>=120?1:0}
function model(){const s=S.sim,ex=Math.max(0,Math.cos((s.wd-240)*Math.PI/180)),f=1+0.6*ex*s.ws/10,hl=s.fc*f,nm=s.fc*1.35,p72=s.past+hl;
 const raw=tier(s.fc,s.fc+s.past),t=Math.max(tier(hl,p72),raw);return{ex,f,hl,nm,p72,raw,t,low:!s.gauge,rawT:raw,nmT:tier(nm,nm+s.past)}}
function reasons(m){const r=[];if(m.hl>=64.5)r.push(`24h rain ${m.hl.toFixed(0)} mm (local estimate) reaches the Watch level of 64.5 mm`);if(m.hl>=115.6)r.push('24h rain exceeds the Warning level of 115.6 mm');if(m.hl>=204.5)r.push('24h rain exceeds the Evacuate level of 204.5 mm');
 if(m.p72>=120)r.push(`72h rain ${m.p72.toFixed(0)} mm: soil likely saturated`);if(m.f>1.3)r.push(`Slope effect x${m.f.toFixed(2)}: wind hits the south-west-facing slope`);return r}
function P(la,lo){return[(lo-76.12)/0.09*600,(11.56-la)/0.09*400]}
function map(m){const pl=[[11.5,76.17],[11.5,76.196],[11.478,76.198],[11.476,76.172]].map(p=>P(...p).join(',')).join(' ');const tc=`var(${TC[S.alert?S.alert.tier:m.t]})`;
 let s=`<svg viewBox="0 0 600 400"><polygon points="${pl}" fill="${tc}" fill-opacity=".25" stroke="${tc}" stroke-width="2"/>`;
 ROUTES.forEach(r=>s+=`<polyline points="${r.pts.map(p=>P(...p).join(',')).join(' ')}" fill="none" stroke="${r.st=='blocked'?'var(--t3)':'var(--t0)'}" stroke-width="4" ${r===ROUTES[1]?'stroke-dasharray="8 5"':''}/>`);
 CAMPS.forEach(c=>{const[x,y]=P(c.la,c.lo);s+=`<rect x="${x-7}" y="${y-7}" width="14" height="14" fill="var(--ac)"/><text x="${x+10}" y="${y+4}">${c.n}</text>`});
 H.forEach(h=>{const[x,y]=P(h.la,h.lo),c=S.conf[h.id],col=c=='needs_help'?'var(--t3)':c=='safe'?'var(--t0)':c=='received'?'var(--t1)':'var(--mu)';s+=`<circle cx="${x}" cy="${y}" r="${h.v?6:4}" fill="${col}" stroke="var(--tx)" stroke-width="${h.v?2:0}"/>`});
 const[gx,gy]=P(11.4895,76.183);return s+`<path d="M${gx-6},${gy+6} L${gx},${gy-7} L${gx+6},${gy+6}Z" fill="#7c3aed"/><text x="${gx-30}" y="${gy+20}">Gauge</text></svg><div class="mu">Square = camp, triangle = rain gauge, circle = household (ring = vulnerable; grey = unconfirmed, amber = received, green = safe, red = needs help). Dashed = alternate route.</div>`}
const pill=t=>`<span class="pill" style="background:var(${TC[t]})">${TN[t]}</span>`;
function defMsg(t){return `AegisFlow ${TN[t]}: heavy rain expected in Chooralmala. Check your link for route and camp. (Demo)`}
function issue(t){S.alert={tier:t,msg:S.msg||defMsg(t),at:Date.now()};S.dl={};S.conf={};S.tasks=[];H.forEach(h=>S.dl[h.id]='queued');log(`ALERT issued: ${TN[t]} by admin (approved from proposal)`);if(t==3)log('Buzzer gateway POST (mock): sounded');
 setTimeout(()=>{H.forEach(h=>S.dl[h.id]=h.id=='h4'?'failed':'sent');log('SMS sent to 6 households (mock provider, numbers masked)');draw()},700);setTimeout(()=>{H.forEach(h=>{if(S.dl[h.id]=='sent')S.dl[h.id]='delivered'});log('Delivery webhooks: delivered; 1 failed, retry queued');draw()},1800);draw()}
function dg(){S.sim.fc=0;}
function adminView(m){const q=m.t>0&&(!S.alert||S.alert.tier<m.t)&&S.rej!==m.t;
 const tabs=['risk','delivery','field','log'].map(t=>`<button class="${S.tab==t?'on':''}" onclick="S.tab='${t}';draw()">${{risk:'Risk and alerts',delivery:'Delivery tracker',field:'Camps, routes, door-knock',log:'Audit log'}[t]}</button>`).join('');
 let b='';if(S.tab=='risk'){const s=S.sim,sl=(k,l,mn,mx)=>`<label>${l}: <b id="v_${k}">${s[k]}</b><input type="range" min="${mn}" max="${mx}" value="${s[k]}" oninput="S.sim.${k}=+this.value;$('v_${k}').textContent=this.value;out()"></label>`;
 b=`<div class="g"><div class="c"><h2>Scenario simulator</h2>${sl('fc','Regional forecast, next 24h (mm)',0,200)}${sl('past','Rain in previous 48h (mm)',0,250)}${sl('ws','Wind speed (km/h)',0,35)}${sl('wd','Wind direction (deg, 240 = south-west)',0,360)}<label><input type="checkbox" ${s.gauge?'checked':''} onchange="S.sim.gauge=this.checked;out()"> Local rain gauge online</label><div class="row" style="margin-top:8px"><button onclick="Object.assign(S.sim,{fc:150,past:110,ws:24,wd:235});draw()">Preset: heavy monsoon day</button><button onclick="Object.assign(S.sim,{fc:20,past:10,ws:8,wd:200});draw()">Preset: calm</button></div></div><div class="c" id="out"></div></div>`}
 if(S.tab=='delivery')b=`<div class="c sc"><h2>Delivery tracker ${S.alert?pill(S.alert.tier):''}</h2>${S.alert?`<table><tr><th>Household</th><th>Lang</th><th>SMS</th><th>Confirmation</th></tr>${H.map(h=>`<tr><td>${h.name}${h.v?' (vulnerable)':''}</td><td>${h.lang}</td><td>${S.dl[h.id]||''}</td><td>${S.conf[h.id]||'unconfirmed'}</td></tr>`).join('')}</table><div class="row" style="margin-top:8px"><button onclick="ff()">Fast-forward 10 min (create door-knock tasks)</button></div>`:'<div class="mu">No alert issued yet. Approve a proposal on the Risk tab.</div>'}</div>`;
 if(S.tab=='field')b=`<div class="g"><div class="c"><h2>Relief camps</h2><table><tr><th>Camp</th><th>Capacity</th><th>Facilities</th></tr>${CAMPS.map(c=>`<tr><td>${c.n}</td><td>${c.cap}</td><td>${c.fac}</td></tr>`).join('')}</table><h2 style="margin-top:12px">Routes</h2>${ROUTES.map(r=>`<div>${r.n}: <b style="color:var(${r.st=='clear'?'--t0':'--t3'})">${r.st}</b></div>`).join('')}</div><div class="c"><h2>Door-knock list</h2>${S.tasks.length?S.tasks.map(t=>`<div>${t.v?'[priority] ':''}${t.n}: ${t.st}${t.note?' ('+t.note+')':''}</div>`).join(''):'<div class="mu">Empty. Appears after fast-forward if households have not confirmed.</div>'}</div></div>`;
 if(S.tab=='log')b=`<div class="c"><h2>Audit log</h2>${S.log.length?S.log.map(l=>`<div class="mu">${l}</div>`).join(''):'<div class="mu">No events yet.</div>'}</div>`;
 return `<div class="row" style="margin-bottom:10px">${tabs}</div>${b}`}
function out(){const e=$('out');if(!e)return;const m=model(),r=reasons(m),q=m.t>0&&(!S.alert||S.alert.tier<m.t)&&S.rej!==m.t,s=S.sim;
 const ins=m.t==0&&m.low;e.innerHTML=`<h2>Risk assessment ${ins?'<span class="pill" style="background:var(--mu)">Insufficient evidence</span>':pill(m.t)}</h2>
 <table><tr><th>Source</th><th>24h</th><th>Tier</th></tr><tr><td>Regional forecast (raw)</td><td>${s.fc} mm</td><td>${TN[m.rawT]}</td></tr><tr><td>Normal pooled model</td><td>${m.nm.toFixed(0)} mm</td><td>${TN[m.nmT]}</td></tr><tr><td><b>Hyperlocal model</b></td><td><b>${m.hl.toFixed(0)} mm</b></td><td><b>${TN[tier(m.hl,m.p72)]}</b></td></tr></table>
 <div class="mu" style="margin:6px 0">72h total ${m.p72.toFixed(0)} mm. Tier = the higher of raw and hyperlocal; confidence never lowers it.</div>
 <div>${r.length?r.map(x=>'• '+x).join('<br>'):'No thresholds crossed.'}</div>${ins?'<div class="ban" style="background:var(--mu);margin-top:8px">Gauge offline and no threshold crossed: insufficient evidence, NOT safe.</div>':''}
 <h2 style="margin-top:10px">Confidence (separate components)</h2><table><tr><td>Data freshness</td><td>${s.gauge?'Fresh (gauge 4 min ago)':'Stale (gauge silent)'}</td></tr><tr><td>Sensor coverage</td><td>${s.gauge?'1 gauge in zone':'0 gauges in zone'}</td></tr><tr><td>Source quality</td><td>${s.gauge?'Sensor + model':'Model only'}</td></tr><tr><td>Calibration</td><td>Default (synthetic demo)</td></tr></table>
 ${q?`<h2 style="margin-top:10px">Pending proposal: ${TN[m.t]} (approval window 15 min)</h2><textarea oninput="S.msg=this.value">${S.msg||defMsg(m.t)}</textarea><div class="row"><button class="p" onclick="issue(${m.t})">Approve and send</button>${m.t>1?`<button onclick="issue(${m.t-1})">Downgrade to ${TN[m.t-1]}</button>`:''}<button onclick="S.rej=${m.t};log('Proposal ${TN[m.t]} rejected');draw()">Reject</button></div>`:S.alert?`<div style="margin-top:10px">Active alert: ${pill(S.alert.tier)}</div>`:''}
 <div style="margin-top:10px">${map(m)}</div>`}
function ff(){H.slice().sort((a,b)=>b.v-a.v).forEach(h=>{if(!S.conf[h.id]&&!S.tasks.find(t=>t.id==h.id))S.tasks.push({id:h.id,n:h.name,v:h.v,st:'pending'})});if(S.alert.tier>1)log('Voice call fallback (mock) to unconfirmed households');log(`Door-knock tasks created: ${S.tasks.length}, vulnerable first`);draw()}
function userView(){const h=H.find(x=>x.id==S.hid),L=S.lang=='ml'?ML:EN,t=S.alert?S.alert.tier:null,blk=ROUTES[0].st=='blocked',cp=CAMPS[h.camp];
 return `<div class="c" style="max-width:460px;margin:auto"><div class="row" style="justify-content:space-between"><select onchange="S.hid=this.value;draw()">${H.map(x=>`<option value="${x.id}" ${x.id==S.hid?'selected':''}>${x.name}</option>`).join('')}</select><div class="row"><button class="${S.lang=='en'?'on':''}" onclick="S.lang='en';draw()">EN</button><button class="${S.lang=='ml'?'on':''}" onclick="S.lang='ml';draw()">മലയാളം</button></div></div><div class="mu">This stands in for the private link /h/token. It can only show this household.</div>
 <h2 style="margin-top:12px;font-size:22px">${t===null?L.noal:`<span class="pill" style="background:var(${TC[t]});font-size:18px">${L.tier[t]}</span>`}</h2>${blk?`<div class="ban">${L.blk}</div>`:''}
 ${t!==null?`<div class="mu" style="margin-bottom:8px">${S.alert.msg}</div><button class="big" onclick="cf('received')">${L.rec}</button><button class="big" onclick="cf('safe')">${L.safe}</button><button class="big" style="border-color:var(--t3)" onclick="cf('needs_help')">${L.help}</button><div>Status: <b>${S.conf[h.id]||'-'}</b></div>`:''}
 <div style="margin-top:10px"><div><b>${L.camp}:</b> ${cp.n} (${cp.fac})</div><div><b>${L.rt}:</b> ${ROUTES[0].n} <b style="color:var(${blk?'--t3':'--t0'})">${ROUTES[0].st}</b></div><div><b>${L.alt}:</b> ${ROUTES[1].n} ${ROUTES[1].st}</div></div></div>`}
function cf(s){S.conf[S.hid]=s;const t=S.tasks.find(x=>x.id==S.hid);if(t&&s!='received')t.st='resolved';log(`Confirmation ${H.find(h=>h.id==S.hid).name}: ${s}`);draw()}
function fieldView(){return `<div class="g"><div class="c"><h2>Volunteer: door-knock tasks</h2>${S.tasks.length?S.tasks.map((t,i)=>`<div style="margin-bottom:8px">${t.v?'[priority] ':''}<b>${t.n}</b>: ${t.st}<div class="row"><button onclick="S.tasks[${i}].st='visited';log('Visited ${t.n}');draw()">Visited</button><button onclick="S.tasks[${i}].st='unreachable';S.tasks[${i}].note='no answer';log('Unreachable ${t.n}');draw()">Unreachable</button></div></div>`).join(''):'<div class="mu">No tasks. Use Admin > Delivery tracker > Fast-forward.</div>'}</div>
 <div class="c"><h2>Warden: route status</h2>${ROUTES.map((r,i)=>`<div style="margin-bottom:8px">${r.n}: <b style="color:var(${r.st=='clear'?'--t0':'--t3'})">${r.st}</b><div class="row"><button onclick="ROUTES[${i}].st='clear';log('Route ${i} set clear by warden');draw()">Clear</button><button onclick="ROUTES[${i}].st='blocked';log('Route ${i} set BLOCKED by warden');draw()">Blocked</button></div></div>`).join('')}<div class="mu">Blocked shows at once on household pages and the admin map.</div></div></div>`}
function draw(){$('roles').innerHTML=[['admin','Admin'],['user','Household'],['field','Volunteer / Warden']].map(([k,l])=>`<button class="${S.role==k?'on':''}" onclick="S.role='${k}';draw()">${l}</button>`).join('');

S.tpl={1:{en:'AegisFlow Watch: heavy rain likely in Chooralmala. Stay alert and keep your link handy.',ml:'ജാഗ്രത: ചൂരൽമലയിൽ കനത്ത മഴയ്ക്ക് സാധ്യത. ജാഗ്രത പാലിക്കുക.'},2:{en:'AegisFlow Warning: prepare to move. Open your link for camp and route.',ml:'മുന്നറിയിപ്പ്: മാറാൻ തയ്യാറാകുക. ക്യാമ്പും വഴിയും നിങ്ങളുടെ ലിങ്കിൽ കാണാം.'},3:{en:'AegisFlow EVACUATE: move to your camp now. Open your link.',ml:'ഒഴിഞ്ഞുപോകുക: ഉടൻ ക്യാമ്പിലേക്ക് പോകുക. നിങ്ങളുടെ ലിങ്ക് തുറക്കുക.'}};
defMsg=t=>S.tpl[t].en+' | '+S.tpl[t].ml;
S.sens=[{id:'RG-CHL-01',type:'Rain gauge',bat:78,seen:'4 min ago'},{id:'SM-CHL-02',type:'Soil moisture',bat:54,seen:'9 min ago'}];
S.links.forEach((l,i)=>l.as=i?'Route: Main road':'Doors: Ward 7');
CAMPS.forEach((c,i)=>c.insp=['02 Aug 2026','28 Jul 2026','05 Aug 2026'][i]);
const card=(h,b)=>`<div class="c"><h2>${h}</h2>${b}</div>`,sOn=s=>s.type=='Rain gauge'?S.sim.gauge:true;
function dashV(){const m=model(),t=S.alert?S.alert.tier:m.t,ins=!S.alert&&m.t==0&&m.low,g=S.sim.gauge,vul=H.filter(h=>h.v).length,r=reasons(m),on=S.sens.filter(sOn).length,pend=m.t>0&&!S.alert&&S.rej!==m.t;
const kp=[['Zones monitored','1',t>=2?'1 high risk':'0 high risk'],['Households',H.length,vul+' vulnerable'],['Active alerts',S.alert?1:0,pend?'1 awaiting approval':'none pending'],['Sensors online',on+' / '+S.sens.length,on<S.sens.length?(S.sens.length-on)+' silent':'all reporting']];
const cf=[['Data freshness',g?'High':'Low'],['Sensor coverage',g?'Medium':'None'],['Source quality',g?'High':'Model only'],['Calibration','Default']];
return `<div class="kpi">${kp.map(k=>`<div class="c"><div class="mu">${k[0]}</div><b>${k[1]}</b><div class="mu">${k[2]}</div></div>`).join('')}</div>
<div class="g"><div class="c"><h2>Zone map</h2>${map(m)}</div><div class="c"><h2>Zone: Chooralmala</h2><div class="tb" style="background:var(${ins?'--mu':TC[t]})">${ins?'Insufficient evidence':TN[t]}</div>${ins?'<div class="mu">Gauge silent and no threshold crossed. This is not the same as safe.</div>':''}
<div class="mu">Confidence components</div><div class="chips">${cf.map(x=>`<span>${x[0]}: <b>${x[1]}</b></span>`).join('')}</div><div class="mu" style="margin-top:8px">Key reasons</div>${r.length?r.map(x=>'• '+x).join('<br>'):'No thresholds crossed.'}
<div class="row" style="margin-top:10px"><button class="p" onclick="S.tab='risk';draw()">${pend?'Review proposal':'Open risk and alerts'}</button></div></div></div>`}
function tplV(){return card('Message templates by tier and language',[1,2,3].map(t=>`<div style="margin-bottom:12px">${pill(t)}<div class="g"><label>English<textarea oninput="S.tpl[${t}].en=this.value">${S.tpl[t].en}</textarea></label><label>മലയാളം<textarea oninput="S.tpl[${t}].ml=this.value">${S.tpl[t].ml}</textarea></label></div></div>`).join('')+'<div class="mu">Saved as you type. Used as the default text for new proposals and manual alerts, and still editable per alert.</div>')}
const AS=['Doors: Ward 7','Doors: Ward 8','Route: Main road','Route: Side road'];
function volV(){return card('Volunteers and wardens',`<div class="sc"><table><tr><th>Person</th><th>Assigned</th><th>Private link</th><th>Status</th><th></th></tr>${S.links.map((l,i)=>`<tr><td>${l.who}</td><td><select onchange="S.links[${i}].as=this.value;log('Assigned '+S.links[${i}].who+' to '+this.value)">${AS.map(a=>`<option ${l.as==a?'selected':''}>${a}</option>`).join('')}</select></td><td>/v/${l.tok.slice(0,8)}…</td><td>${l.rev?'revoked':'active'}</td><td><button onclick="lk(${i},'r')">Revoke</button> <button onclick="lk(${i},'i')">Reissue</button></td></tr>`).join('')}</table></div><h2 style="margin-top:12px">Create and issue a link</h2><div class="row"><input id="vn" placeholder="Name"><select id="vr"><option>Volunteer</option><option>Warden</option></select><button class="p" onclick="addV()">Create</button></div><div class="mu">Each link works only for its assigned zone or route. A real system stores just a hash of the token.</div>`)}
function addV(){const n=$('vn').value.trim();if(!n)return;S.links.push({who:$('vr').value+': '+n,tok:rt(),rev:false,as:AS[0]});log('Link issued: '+$('vr').value+' '+n);draw()}
function senV(){const silent=S.sens.filter(s=>!sOn(s));return (silent.length?`<div class="ban">Silent sensor: ${silent.map(s=>s.id).join(', ')} has not reported for over 3 hours.</div>`:'')+card('Sensor health',`<div class="sc"><table><tr><th>ID</th><th>Type</th><th>Status</th><th>Battery</th><th>Last seen</th><th>Device key</th></tr>${S.sens.map(s=>`<tr><td>${s.id}</td><td>${s.type}</td><td><b style="color:var(${sOn(s)?'--t0':'--t3'})">${sOn(s)?'online':'SILENT'}</b></td><td>${sOn(s)?s.bat+'%':'-'}</td><td>${sOn(s)?s.seen:'3 h 20 min ago'}</td><td>${s.key||'••••'}</td></tr>`).join('')}</table></div>`)+card('Register sensor',`<div class="row"><input id="si" placeholder="Sensor ID"><select id="st"><option>Rain gauge</option><option>Soil moisture</option><option>Water level</option></select><input id="sk" placeholder="Device key (from superadmin)"><button class="p" onclick="addS()">Register</button></div><div class="mu" id="sm">Device keys are generated by the superadmin, never by the region admin.</div>`)}
function addS(){const i=$('si').value.trim(),k=$('sk').value.trim();if(!i||k.length<12){$('sm').textContent='Sensor ID required and device key must be at least 12 characters.';return}S.sens.push({id:i,type:$('st').value,bat:100,seen:'just now',key:'••••'+k.slice(-4)});log('Sensor registered: '+i);draw()}
function fieldX(){return `<div class="g"><div class="c"><h2>Camp inspection</h2>${CAMPS.map((c,i)=>`<div style="margin-bottom:6px"><b>${c.n}</b>: ${c.occ}/${c.cap}<div class="mu">${c.fac}</div>Last inspected <b>${c.insp}</b> <button onclick="CAMPS[${i}].insp=new Date().toLocaleDateString();log('Camp inspected: '+CAMPS[${i}].n);draw()">Mark inspected today</button></div>`).join('')}</div><div class="c"><h2>Route status history</h2>${ROUTES.map(r=>`<div>${r.n}: <b style="color:var(${r.st=='clear'?'--t0':'--t3'})">${r.st}</b></div>`).join('')}<div class="mu" style="margin-top:6px">${S.log.filter(l=>l.includes('Route ')).map(l=>l).join('<br>')||'No route changes yet. Wardens set status from their link.'}</div></div></div>`}
const NV={dash:dashV,tpl:tplV,vol:volV,sen:senV},_a4=adminView;
adminView=function(m){if(NV[S.tab])return NV[S.tab]();let h=_a4(m);if(S.tab=='field')h+=fieldX();return h};
const ph=b=>`<div class="phone"><div class="sbar"><span>9:41</span><span>●●● ▮</span></div><div class="ptitle">🍃 AegisFlow</div><div class="pbody">${b}</div></div>`,_u10=userView,_f10=fieldView;

const NAV=[['dash','▦','Dashboard'],['risk','◎','Risk and alerts'],['tpl','✉','Message templates'],['delivery','⇄','Delivery tracker'],['field','⛺','Camps and routes'],['hh','⌂','Households'],['vol','☰','Volunteers and wardens'],['sen','◉','Sensors'],['cfg','⚙','Config and links'],['inc','▤','Incidents and reports'],['log','≡','Audit log']];
const _d4=draw;draw=function(){_d4();document.body.className='r-'+S.role;let sb=$('sb');if(!sb){sb=document.createElement('nav');sb.id='sb';document.body.prepend(sb)}
sb.innerHTML='<div class="lg">🍃 AegisFlow<div>Hyperlocal intelligence. Proactive protection.</div></div>'+NAV.map(n=>`<button class="${S.tab==n[0]?'on':''}" onclick="S.tab='${n[0]}';draw()">${n[1]} ${n[2]}</button>`).join('')+'<div class="ft"><b>Admin</b><br>Wayanad region only</div>'};
draw();
